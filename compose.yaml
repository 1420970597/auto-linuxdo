name: auto-linuxdo

services:
  linuxdo:
    build:
      context: .
      target: runtime
    init: true
    hostname: linuxdo
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    environment:
      LINUXDO_REFRESH_SECONDS: ${LINUXDO_REFRESH_SECONDS:-7200}
    ports:
      - "127.0.0.1:${LINUXDO_PORT:-8765}:8765"
    volumes:
      - state:/var/lib/linuxdo
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  state:
