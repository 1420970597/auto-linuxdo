<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="将当前 Chrome 的 Linux.do 会话同步到本机 Docker 服务。">
  <title>Linux.do 会话同步</title>
  <link rel="stylesheet" href="sync.css">
  <script src="sync.js" defer></script>
</head>
<body>
  <main>
    <h1>Linux.do 会话同步</h1>
    <p id="status" role="status" aria-live="polite">正在读取同步状态…</p>
    <form id="connect" hidden>
      <label for="key">本机同步密钥</label>
      <input id="key" type="password" autocomplete="off" required minlength="43" maxlength="43" spellcheck="false">
      <label for="port">Docker 服务端口</label>
      <input id="port" type="number" min="1" max="65535" value="8765" required>
      <button type="submit">开启自动同步</button>
    </form>
    <div id="actions" hidden>
      <button type="button" id="sync">立即同步</button>
      <button type="button" id="pause" class="secondary">暂停并解除配对</button>
      <p class="note">暂停后，Docker 中现有的会话会保留到失效或手动清除。</p>
    </div>
    <noscript>此页面需要 JavaScript。</noscript>
  </main>
</body>
</html>
