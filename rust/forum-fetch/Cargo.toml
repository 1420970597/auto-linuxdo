[package]
name = "forum-fetch"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "forum-fetch"
path = "src/main.rs"

[dependencies]
cfsolve = { path = "../../vendor/cfsolve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
